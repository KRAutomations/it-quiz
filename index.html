<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>IT Quiz · Professional Edition</title>
<style>
:root{--ink:#eef0f7;--mut:#9aa3b8;--gold:#d8b56a;--gold2:#f3e2b3;--gold3:#a37e2c;--ok:#1fbf8a;--bad:#e5586b;--line:rgba(255,255,255,.09);--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{height:100%;background:#05070d}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;gap:22px;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px));background:radial-gradient(1100px 700px at 12% -10%,#1b2650 0%,transparent 60%),radial-gradient(900px 620px at 105% 8%,#33193f 0%,transparent 58%),radial-gradient(900px 700px at 50% 120%,#0f2a33 0%,transparent 60%),linear-gradient(180deg,#0a0e1a,#05070d) fixed}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 30%,#000 0%,transparent 70%)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 22s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:#c9a24d;top:-120px;left:-80px}
.o2{width:420px;height:420px;background:#3b5bdb;bottom:-160px;right:-120px;animation-delay:-8s}
.o3{width:300px;height:300px;background:#7c3aed;top:40%;left:55%;opacity:.22;animation-delay:-14s}
@keyframes drift{to{transform:translate3d(60px,40px,0) scale(1.12)}}
.hd,.card,.foot{position:relative;z-index:1}
.hd{display:flex;align-items:center;gap:16px;width:min(94vw,560px)}
.logo{width:54px;height:54px;flex:none;filter:drop-shadow(0 6px 18px rgba(216,181,106,.35))}
.hd h1{margin:0;font-family:var(--serif);font-weight:600;font-size:1.9rem;letter-spacing:.34em;text-transform:uppercase;background:linear-gradient(120deg,#fff 0%,var(--gold2) 40%,var(--gold) 70%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.hd p{margin:4px 0 0;font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--mut)}
.card{width:min(94vw,560px);padding:26px 24px 24px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--line);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);box-shadow:0 40px 90px -24px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1)}
.card::before{content:"";position:absolute;left:28px;right:28px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.9}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cnt{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);font-weight:600}
.pills{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:.82rem;font-weight:700;color:var(--ink)}
.pill svg{width:15px;height:15px}
.pill b{font-variant-numeric:tabular-nums}
.bar{height:5px;background:rgba(255,255,255,.08);border-radius:99px;margin:16px 0 24px;overflow:hidden}
#fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold3),var(--gold),var(--gold2));box-shadow:0 0 14px rgba(216,181,106,.7);transition:width .5s cubic-bezier(.2,.8,.2,1)}
#note{margin:0 0 10px;font-size:.8rem;color:var(--gold2)}#note:empty{display:none}
#q{font-family:var(--serif);font-size:1.38rem;line-height:1.38;font-weight:600;margin:0 0 20px;color:#fff;letter-spacing:.005em}
#stage.in{animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opt{display:flex;align-items:center;gap:14px;width:100%;margin:10px 0;padding:13px 16px 13px 13px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));color:var(--ink);font:600 1rem/1.35 var(--sans);text-align:left;cursor:pointer;transition:transform .18s,border-color .18s,background .18s,box-shadow .18s,opacity .18s}
.opt:hover{transform:translateY(-2px);border-color:rgba(216,181,106,.55);background:linear-gradient(180deg,rgba(216,181,106,.14),rgba(216,181,106,.04));box-shadow:0 12px 28px -14px rgba(216,181,106,.5)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,#snd:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.opt .k{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:.85rem;letter-spacing:.04em;color:var(--gold2);background:rgba(216,181,106,.1);border:1px solid rgba(216,181,106,.32)}
.opt .t{flex:1}
.opt .ic{flex:none;width:22px;height:22px}
.lock .opt{cursor:default;transform:none;box-shadow:none}
.opt.ok{border-color:rgba(31,191,138,.75);background:linear-gradient(135deg,rgba(31,191,138,.28),rgba(31,191,138,.07));box-shadow:0 0 0 1px rgba(31,191,138,.25),0 14px 30px -14px rgba(31,191,138,.6)}
.opt.ok .k{background:var(--ok);color:#03130d;border-color:transparent}
.opt.bad{border-color:rgba(229,88,107,.75);background:linear-gradient(135deg,rgba(229,88,107,.28),rgba(229,88,107,.07));animation:shake .35s}
.opt.bad .k{background:var(--bad);color:#1a0509;border-color:transparent}
.opt.dim{opacity:.4}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{display:none;margin:16px 0 4px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);border-left-width:3px;background:rgba(255,255,255,.04);font-size:.92rem;line-height:1.5;color:#d9deec}
.fb.show{display:block;animation:rise .35s}
.fb.good{border-left-color:var(--ok)}.fb.miss{border-left-color:var(--bad)}
.fb strong{display:block;margin-bottom:4px;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase}
.fb.good strong{color:var(--ok)}.fb.miss strong{color:var(--bad)}
.fb p{margin:0}
.src{margin-top:10px;font-size:.8rem;color:var(--mut)}
.src a,.rv a{color:var(--gold2);text-decoration-color:rgba(216,181,106,.5);text-underline-offset:3px}
.btn{position:relative;overflow:hidden;height:52px;padding:0 34px;border:0;border-radius:14px;font:700 .92rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#1b1303;cursor:pointer;background:linear-gradient(135deg,var(--gold2),var(--gold) 45%,#b98d3c);box-shadow:0 14px 34px -10px rgba(216,181,106,.6),inset 0 1px 0 rgba(255,255,255,.65);transition:transform .18s,box-shadow .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 40px -10px rgba(216,181,106,.75),inset 0 1px 0 rgba(255,255,255,.65)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover::after{left:130%}
#next{display:none;margin-top:14px;width:100%}
.ghost{border:0;background:none;color:var(--mut);font:600 .8rem var(--sans);letter-spacing:.06em;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:8px}
.ghost:hover{color:var(--gold2)}
#res{display:none;text-align:center}
.lbl{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.gauge{position:relative;width:184px;height:184px;margin:10px auto 6px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .trk{stroke:rgba(255,255,255,.08)}
#ring{stroke:url(#rg);stroke-linecap:round;stroke-dasharray:339.292;stroke-dashoffset:339.292;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px rgba(216,181,106,.55))}
.gauge .big{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:62px;font-family:var(--serif);font-size:2.6rem;font-weight:600;color:#fff}
.gauge .big small{font-size:1rem;color:var(--mut)}
#rank{font-family:var(--serif);font-size:1.5rem;margin:10px 0 2px;background:linear-gradient(120deg,#fff,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
#rmsg{margin:0 0 6px;color:var(--mut);font-size:.95rem}
.best{display:inline-block;margin:8px 0 4px;padding:6px 16px;border-radius:99px;border:1px solid rgba(216,181,106,.35);background:rgba(216,181,106,.08);font-size:.82rem;color:var(--gold2)}
#review{text-align:left;margin-top:14px}
#review h3{margin:0 0 10px;font-family:var(--serif);font-size:1.1rem;letter-spacing:.04em}
.none{text-align:center;color:var(--gold2);font-size:.9rem;padding:8px 0}
.rv{padding:14px 16px;margin:10px 0;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:.88rem;line-height:1.5;color:#cfd5e6}
.rv b{display:block;color:#fff;font-size:.95rem;margin-bottom:6px}
.rv .ans{display:inline-block;margin:2px 0 6px;padding:3px 10px;border-radius:8px;background:rgba(31,191,138,.14);border:1px solid rgba(31,191,138,.4);color:#7ee8c3;font-weight:600}
.acts{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:4px}
#snd{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:rgba(15,20,36,.7);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);font:600 .78rem var(--sans);letter-spacing:.08em;cursor:pointer;transition:border-color .2s}
#snd:hover{border-color:rgba(216,181,106,.55)}
#snd svg{width:17px;height:17px;color:var(--gold)}#snd.off svg{color:var(--mut)}
.foot{margin:0;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#6f7893;text-align:center;line-height:1.7}
@media(max-width:420px){.hd h1{font-size:1.5rem;letter-spacing:.26em}#q{font-size:1.2rem}.card{padding:22px 16px}#snd span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<header class="hd">
 <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e2b3"/><stop offset=".55" stop-color="#d8b56a"/><stop offset="1" stop-color="#a37e2c"/></linearGradient></defs><path d="M24 3l18 10.5v21L24 45 6 34.5v-21z" fill="rgba(216,181,106,.08)" stroke="url(#lg)" stroke-width="2"/><path d="M15 25l6 6 12-13" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>

 </div>

<script>

const Q=[
{q:'What does RAM stand for?',a:['Random Access Memory','Read Always Memory','Remote Access Module','Rapid Application Manager'],e:'RAM is the fast, temporary memory a computer uses for running programs.',s:'CompTIA A+ 220-1201 V15 exam objectives (PDF)|https://lecbyo.files.cmp.optimizely.com/download/34be017cb73211ef8985a6f347fbf652'},
{q:'Which shortcut opens Task Manager directly in Windows?',a:['Ctrl + Shift + Esc','Ctrl + Alt + Tab','Windows + T','Alt + F4'],e:'Ctrl + Shift + Esc opens Task Manager straight away.',s:'CompTIA A+ 220-1202 V15 exam objectives (PDF)|https://lecbyo.files.cmp.optimizely.com/download/cefedfb2b8a511ef809306d06d323538'},

{q:'What does DNS do?',a:['Translates website names into IP addresses','Assigns IP addresses','Encrypts emails','Backs up files'],e:'DNS works like a phone book for the internet.',s:'CompTIA A+ 220-1201 exam objectives, networking'},
{q:'Which port does HTTPS normally use?',a:['443','80','21','25'],e:'HTTPS uses port 443. Plain HTTP uses port 80.',s:'CompTIA A+ 220-1201 exam objectives, 2.1 ports and protocols'},
{q:'What does VPN stand for?',a:['Virtual Private Network','Very Protected Node','Verified Public Network','Virtual Packet Namespace'],e:'A VPN creates a secure, private connection over the internet.',s:'CompTIA A+ 220-1201 exam objectives, networking'},
{q:'Which command shows a Windows PC\'s IP settings?',a:['ipconfig','netstat -x','showip','ifstat'],e:'ipconfig shows IP address, gateway and DNS settings.',s:'Microsoft Learn: Windows commands reference|https://learn.microsoft.com/windows-server/administration/windows-commands/windows-commands'},
{q:'Which shortcut locks a Windows PC?',a:['Windows + L','Windows + D','Ctrl + L','Alt + L'],e:'Windows + L locks the screen straight away.',s:'Microsoft Support: Keyboard shortcuts in Windows|https://support.microsoft.com/en-us/help/12445/windows-keyboard-shortcuts'},
{q:'What does SSD stand for?',a:['Solid State Drive','Super Speed Disk','Secure System Drive','Static Storage Device'],e:'An SSD stores data on flash memory with no moving parts.',s:'CompTIA A+ 220-1201 V15 exam objectives (PDF)|https://lecbyo.files.cmp.optimizely.com/download/34be017cb73211ef8985a6f347fbf652'},
{q:'What is phishing?',a:['Fake messages that trick you into giving away information','A virus that slows your PC','A way to speed up the internet','A backup method'],e:'Phishing tries to steal passwords or details, often by email.',s:'NCSC: Avoiding phishing attacks|https://www.ncsc.gov.uk/collection/small-business-guide/avoiding-phishing-attacks'},
{q:'Which address range is a private IP range?',a:['192.168.x.x','8.8.8.8','1.1.1.1','203.0.113.x'],e:'192.168.x.x, 10.x.x.x and 172.16 to 172.31.x.x are private ranges.',s:'CompTIA A+ 220-1201 V15 exam objectives (PDF)|https://lecbyo.files.cmp.optimizely.com/download/34be017cb73211ef8985a6f347fbf652'},
{q:'What does MFA stand for?',a:['Multi-Factor Authentication','Main File Access','Multiple Folder Archive','Managed Firewall Alert'],e:'MFA needs more than a password, such as a code from your phone.',s:'NCSC: Activate 2-step verification (also called MFA)|https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/activate-2-step-verification-on-your-email'},
{q:'Which command tests if another device can be reached?',a:['ping','dir','copy','cls'],e:'ping sends a small test message and waits for a reply.',s:'Microsoft Learn: Windows commands reference|https://learn.microsoft.com/windows-server/administration/windows-commands/windows-commands'},
{q:'What does USB stand for?',a:['Universal Serial Bus','United System Board','Universal Storage Block','Unified Serial Backup'],e:'USB is the standard connector for drives, keyboards and chargers.',s:'CompTIA A+ 220-1201 V15 exam objectives (PDF)|https://lecbyo.files.cmp.optimizely.com/download/34be017cb73211ef8985a6f347fbf652'},
{q:'What is a firewall for?',a:['Filtering network traffic to block unwanted connections','Cooling the PC','Compressing files','Cleaning the registry'],e:'A firewall allows or blocks traffic based on rules.',s:'CompTIA A+ 220-1202 V15 exam objectives (PDF)|https://lecbyo.files.cmp.optimizely.com/download/cefedfb2b8a511ef809306d06d323538'},
{q:'Which security chip does Windows 11 require?',a:['TPM 2.0','TPM 0.5','GPU 3.0','NIC 2.0'],e:'Windows 11 needs TPM 2.0 for hardware-based security.',s:'Microsoft: Windows 11 system requirements|https://support.microsoft.com/kb/5005380'},
{q:'What is the default file system for Windows?',a:['NTFS','ext4','APFS','HFS+'],e:'NTFS is used by Windows. ext4 is Linux and APFS is Apple.',s:'CompTIA A+ 220-1202 V15 exam objectives (PDF)|https://lecbyo.files.cmp.optimizely.com/download/cefedfb2b8a511ef809306d06d323538'},
{q:'What does a "blue screen" (BSOD) usually mean?',a:['A serious system error stopped Windows','The screen needs cleaning','The monitor is in night mode','A software update finished'],e:'A blue screen shows when Windows hits an error it cannot recover from.',s:'CompTIA A+ 220-1202 V15 exam objectives (PDF)|https://lecbyo.files.cmp.optimizely.com/download/cefedfb2b8a511ef809306d06d323538'},
{q:'What does a cache do?',a:['Stores data nearby for faster access','Deletes old files','Encrypts passwords','Blocks adverts'],e:'A cache keeps frequently used data close so it loads faster.',s:'General IT fundamentals (no single official source)'},

{q:'What does CPU stand for?',a:['Central Processing Unit','Computer Power Unit','Central Program Utility','Core Processing Updater'],e:'The CPU runs the instructions that programs give it.',s:'CompTIA A+ 220-1201 V15 exam objectives (PDF)|https://lecbyo.files.cmp.optimizely.com/download/34be017cb73211ef8985a6f347fbf652'},
{q:'What does GPU stand for?',a:['Graphics Processing Unit','General Power Unit','Graphical Program Utility','Generic Processing Unit'],e:'The GPU handles graphics and visual work.',s:'CompTIA A+ 220-1201 V15 exam objectives (PDF)|https://lecbyo.files.cmp.optimizely.com/download/34be017cb73211ef8985a6f347fbf652'},
{q:'Which part keeps your files when the power is off?',a:['Hard drive or SSD','RAM','CPU cache','Heat sink'],e:'RAM is temporary; drives store files long term.',s:'CompTIA A+ 220-1201 V15 exam objectives (PDF)|https://lecbyo.files.cmp.optimizely.com/download/34be017cb73211ef8985a6f347fbf652'},
{q:'What does a PSU do?',a:['Supplies power to the components','Cools the CPU','Stores data','Connects to Wi-Fi'],e:'PSU means Power Supply Unit.',s:'CompTIA A+ 220-1201 V15 exam objectives (PDF)|https://lecbyo.files.cmp.optimizely.com/download/34be017cb73211ef8985a6f347fbf652'},

];
const PER_ROUND=10;
const $=id=>document.getElementById(id);
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#7ee8c3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CROSS='<svg viewBox="0 0 24 24" fill="none" stroke="#ff8fa0" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
const C=2*Math.PI*54;
let order,i,score,streak,best=0,locked,snd=true,AC=null,note='',st=loadState(),wrongList=[];
try{best=+localStorage.getItem('itQuizBest')||0}catch(e){}
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function tone(f,d,type,vol){if(!snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function good(){[784,988,1175].forEach((f,k)=>setTimeout(()=>tone(f,.28,'sine'),k*90))}
function bad(){tone(260,.1,'triangle',.1);setTimeout(()=>tone(200,.2,'triangle',.1),130)}
function loadState(){try{const s=JSON.parse(localStorage.getItem('itQuizState'));if(s&&Array.isArray(s.done)&&Array.isArray(s.wrong))return s}catch(e){}return{done:[],wrong:[]}}
function saveState(){try{localStorage.setItem('itQuizState',JSON.stringify(st))}catch(e){}}
function pickRound(){
const wrongQ=shuffle(Q.filter(q=>st.wrong.includes(q.q))).slice(0,3);
const fresh=shuffle(Q.filter(q=>!st.done.includes(q.q)&&!st.wrong.includes(q.q)));
let r=[...wrongQ,...fresh].slice(0,PER_ROUND);
if(r.length<PER_ROUND){const used=r.map(q=>q.q);st.done=[];saveState();r=r.concat(shuffle(Q.filter(q=>!used.includes(q.q)))).slice(0,PER_ROUND);note='You have now seen every question, so the question list has started again.'}
return shuffle(r)}
function setSnd(){const b=$('snd');b.classList.toggle('off',!snd);b.setAttribute('aria-pressed',String(snd));b.innerHTML=(snd?SPK_ON:SPK_OFF)+'<span>'+(snd?'Sound on':'Sound off')+'</span>'}
function start(){note='';wrongList=[];order=pickRound();i=0;score=0;streak=0;$('res').style.display='none';$('quiz').style.display='block';show()}
function show(){
locked=false;const q=order[i];
$('prog').textContent='Question '+(i+1)+' of '+order.length;
$('fill').style.width=(i/order.length*100)+'%';
$('score').textContent=score;$('streak').textContent=streak;
$('q').textContent=q.q;$('note').textContent=(i===0?note:'');
const fb=$('fb');fb.className='fb';fb.textContent='';$('next').style.display='none';
const stg=$('stage');stg.classList.remove('in');void stg.offsetWidth;stg.classList.add('in');
const box=$('opts');box.className='';box.innerHTML='';
shuffle(q.a.map((t,k)=>({t,ok:k===0}))).forEach((o,k)=>{
const b=document.createElement('button');b.type='button';b.className='opt';
const kk=document.createElement('span');kk.className='k';kk.textContent='ABCD'[k];
const t=document.createElement('span');t.className='t';t.textContent=o.t;
const ic=document.createElement('span');ic.className='ic';
b.append(kk,t,ic);b._ok=o.ok;b.onclick=()=>pick(b,q);box.appendChild(b)})}
function pick(btn,q){
if(locked)return;locked=true;
$('opts').classList.add('lock');
document.querySelectorAll('.opt').forEach(b=>{b.classList.add(b._ok?'ok':(b===btn?'bad':'dim'));const ic=b.querySelector('.ic');if(b._ok)ic.innerHTML=CHECK;else if(b===btn)ic.innerHTML=CROSS});
const ok=btn._ok;
if(ok){score++;streak++;good();st.wrong=st.wrong.filter(x=>x!==q.q);if(!st.done.includes(q.q))st.done.push(q.q)}else{streak=0;bad();wrongList.push(q);st.done=st.done.filter(x=>x!==q.q);if(!st.wrong.includes(q.q))st.wrong.push(q.q)}saveState();
$('score').textContent=score;$('streak').textContent=streak;
const fb=$('fb');fb.className='fb show '+(ok?'good':'miss');fb.textContent='';
const h=document.createElement('strong');h.textContent=ok?'Correct':'Not quite';
const p=document.createElement('p');p.textContent=q.e;fb.append(h,p);
const sp=(q.s||'').split('|');
if(sp[0]){const s=document.createElement('div');s.className='src';
if(sp[1]){s.appendChild(document.createTextNode('Source: '));const a=document.createElement('a');a.href=sp[1];a.target='_blank';a.rel='noopener noreferrer';a.textContent=sp[0];s.appendChild(a)}
else s.textContent='Source: '+sp[0];
fb.appendChild(s)}
const nx=$('next');nx.textContent=i===order.length-1?'See results':'Next';nx.style.display='block';
try{nx.focus({preventScroll:true});nx.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}
$('next').onclick=()=>{i++;i<order.length?show():finish()};
document.addEventListener('keydown',e=>{
if(e.ctrlKey||e.metaKey||e.altKey||locked||$('quiz').style.display==='none')return;
const k=e.key.toLowerCase(),idx='1234'.includes(k)&&k?'1234'.indexOf(k):'abcd'.indexOf(k);
if(k.length===1&&idx>=0){const o=document.querySelectorAll('.opt')[idx];if(o)o.click()}});
function renderReview(){
const box=$('review');box.innerHTML='';
if(!wrongList.length){const d=document.createElement('div');d.className='none';d.textContent='No wrong answers this round. Flawless.';box.appendChild(d);return}
const t=document.createElement('h3');t.textContent='Review your wrong answers';box.appendChild(t);
wrongList.forEach(q=>{
const d=document.createElement('div');d.className='rv';
const b=document.createElement('b');b.textContent=q.q;d.appendChild(b);
const a=document.createElement('span');a.className='ans';a.textContent='Correct: '+q.a[0];d.appendChild(a);
const e=document.createElement('div');e.textContent=q.e;d.appendChild(e);
const s=document.createElement('div');s.style.marginTop='8px';
const p=(q.s||'').split('|'),link=document.createElement('a');
link.target='_blank';link.rel='noopener noreferrer';
if(p[1]){link.href=p[1];link.textContent='Source: '+p[0];s.appendChild(link)}
else{if(p[0])s.appendChild(document.createTextNode('Source: '+p[0]+' \u2022 '));
link.href='https://www.google.com/search?q='+encodeURIComponent(q.q+' IT');link.textContent='Look this up';s.appendChild(link)}
d.appendChild(s);box.appendChild(d)})}
function finish(){
$('fill').style.width='100%';$('quiz').style.display='none';$('res').style.display='block';
const f=$('final');f.textContent='';f.append(String(score));const sm=document.createElement('small');sm.textContent='\u2009/\u2009'+order.length;f.appendChild(sm);
const r=score/order.length;
$('rank').textContent=r===1?'Flawless':r>=.8?'Distinguished':r>=.6?'Proficient':r>=.4?'Developing':'Foundation';
$('rmsg').textContent=r===1?'A perfect round. IT legend.':r>=.8?'Excellent work.':r>=.6?'Good job, nearly there.':r>=.4?'Not bad. Have another go.':'Keep practising, you will get there.';
if(score>best){best=score;try{localStorage.setItem('itQuizBest',best)}catch(e){}}
$('best').textContent=best+' / '+PER_ROUND;renderReview();
const ring=$('ring');ring.style.strokeDashoffset=C;void ring.getBoundingClientRect();ring.style.strokeDashoffset=C*(1-r);
window.scrollTo({top:0,behavior:'smooth'});
if(r>=.7){good();confetti()}}
$('again').onclick=start;
$('reset').onclick=()=>{st={done:[],wrong:[]};saveState();$('reset').textContent='History cleared'};
$('snd').onclick=()=>{snd=!snd;setSnd()};
function confetti(){
try{
const ms=4000,cv=document.createElement('canvas');cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50';
document.documentElement.appendChild(cv);
const d=window.devicePixelRatio||1,vw=document.documentElement.clientWidth||innerWidth||360,vh=innerHeight||600,W=cv.width=Math.round(vw*d),H=cv.height=Math.round(vh*d),g=cv.getContext('2d');
const br=$('app').getBoundingClientRect(),oy=Math.min(Math.max(br.bottom,vh*.5),vh)*d,lx=Math.max(br.left,0)*d,rx=Math.min(br.right,vw)*d;
const cols=['#f3e2b3','#d8b56a','#b98d3c','#ffffff','#1fbf8a','#7c9cff','#c4a3ff'],P=[];
function burst(n){for(let k=0;k<n;k++){const L=k%2===0,a=(-35-Math.random()*45)*Math.PI/180,s=(14+Math.random()*12)*d;
P.push({x:L?lx:rx,y:oy,vx:Math.cos(a)*s*(L?1:-1),vy:Math.sin(a)*s,w:(5+Math.random()*6)*d,h:(9+Math.random()*8)*d,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]})}}
burst(110);setTimeout(()=>burst(70),500);
const t0=performance.now();
(function f(){const e=performance.now()-t0;g.clearRect(0,0,W,H);g.globalAlpha=Math.max(0,Math.min(1,(ms-e)/800));
P.forEach(p=>{p.vy+=.38*d;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()});
if(e<ms)requestAnimationFrame(f);else cv.remove()})()}catch(e){}}
setSnd();start();
</script>
